<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E7A" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#redGrad)" filter="url(#shadow)" />
  <!-- Center Book / Card icon -->
  <g transform="translate(106, 106) scale(0.58)">
    <rect x="60" y="40" width="360" height="480" rx="36" fill="#FFFFFF" opacity="0.95" />
    <rect x="100" y="100" width="160" height="24" rx="12" fill="#E11D48" />
    <rect x="100" y="150" width="280" height="32" rx="10" fill="#1F2937" />
    <rect x="100" y="200" width="220" height="20" rx="8" fill="#6B7280" />
    <!-- Visual card divider -->
    <line x1="100" y1="260" x2="380" y2="260" stroke="#E5E7EB" stroke-width="4" stroke-dasharray="8 8" />
    <rect x="100" y="300" width="120" height="120" rx="20" fill="#FFE4E8" />
    <rect x="240" y="310" width="140" height="20" rx="8" fill="#E11D48" />
    <rect x="240" y="350" width="120" height="16" rx="6" fill="#9CA3AF" />
    <rect x="240" y="380" width="100" height="16" rx="6" fill="#9CA3AF" />
  </g>
</svg>