name: Build Multiplatform Apps (Android APK, Windows & Mac)

on:
  workflow_dispatch: # 支持在 GitHub 网页一键点击 Run workflow
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Build Web Assets (dist)
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare Artifact
        run: |
          mkdir -p build-out
          cp android/app/build/outputs/apk/debug/app-debug.apk build-out/RedCard-Studio.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: RedCard-Studio-Android-APK
          path: build-out/RedCard-Studio.apk

  build-windows:
    name: Build Windows App (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          npm install -D electron electron-builder

      - name: Build Web Assets (dist)
        run: npm run build

      - name: Compile Native Lightweight Exe (C# Edge Host)
        run: |
          C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe /target:winexe /win32icon:app.ico /out:RedCard_Studio.exe launcher.cs

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RedCard-Studio-Windows
          path: |
            RedCard_Studio.exe
            RedCard Studio.exe

  build-mac:
    name: Build macOS DMG (.dmg / .zip)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          npm install -D electron electron-builder

      - name: Build Web Assets (dist)
        run: npm run build

      - name: Package macOS App (DMG & Universal)
        run: npx electron-builder --mac --universal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RedCard-Studio-macOS
          path: |
            release/*.dmg
            release/*.zip
