name: Build Multiplatform Apps (Android APK, Windows & Mac)

on:
  workflow_dispatch: # 支持在 GitHub 网页一键点击 Run workflow
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  build-android:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Test Generation
        run: npm test

      - name: Build Web Assets (dist)
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare Artifact
        run: |
          mkdir -p build-out
          cp android/app/build/outputs/apk/debug/app-debug.apk build-out/RedCard-Studio.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: RedCard-Studio-Android-APK
          path: build-out/RedCard-Studio.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows App (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Windows Launcher
        run: npm run desktop:build-win

      - name: Build Web Assets (dist)
        run: npm run build

      - name: Package Windows Launcher and Resources
        run: Compress-Archive -Path 'RedCard Studio.exe', 'dist' -DestinationPath 'RedCard-Studio-Windows.zip'

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RedCard-Studio-Windows
          path: RedCard-Studio-Windows.zip
          if-no-files-found: error

  build-mac:
    name: Build macOS DMG (.dmg / .zip)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets (dist)
        run: npm run build

      - name: Package macOS App (DMG & Universal)
        run: |
          npm run pack:mac
          test -n "$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$(find release -maxdepth 1 -name '*.zip' -print -quit)"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RedCard-Studio-macOS
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
